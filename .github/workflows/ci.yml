name: CI

on:
  push:
    branches: [main, uat, stage, "feature/**"]
  pull_request:
    branches: [main, uat, stage]

jobs:
  basic-ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run test suite
        env:
          NODE_ENV: test
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          DB_NAME: aws_serverless
          TEST_DB_NAME: aws_serverless_test
        run: npm test
      
      - name: Build Docker image
        run: docker buildx build --platform linux/amd64 --provenance=false -t aws-serverless-project:ci .

      - name: Check Terraform formatting
        run: terraform -chdir=terraform fmt -check -recursive
      
      - name: Initialize Terraform
        run: terraform -chdir=terraform init -backend=false

      - name: Validate Terraform
        run: terraform -chdir=terraform validate

      - name: CI completed
        run: echo "CI job completed successfully."



