name: CI

on:
  push:
    branches: [main, uat, stage, "feature/**"]
  pull_request:
    branches: [main, uat, stage]

jobs:
  basic-ci:
    runs-on: ubuntu-latest
    
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      - name: Test AWS STS directly
        shell: bash
        run: |
          TOKEN=$(curl -sS \
          -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
          "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" \
          | jq -r '.value')

          aws sts assume-role-with-web-identity \
            --role-arn "arn:aws:iam::460783431820:role/GitHubActionsCIRole" \
            --role-session-name "github-oidc-test" \
            --web-identity-token "$TOKEN" \
            --duration-seconds 900
      
      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run test suite
        env:
          NODE_ENV: test
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          DB_NAME: aws_serverless
          TEST_DB_NAME: aws_serverless_test
        run: npm test
      
      - name: Build Docker image
        run: docker buildx build --platform linux/amd64 --provenance=false -t aws-serverless-project:ci .

      - name: Check Terraform formatting
        run: terraform -chdir=terraform fmt -check -recursive
      
      - name: Initialize Terraform
        run: terraform -chdir=terraform init -backend=false

      - name: Validate Terraform
        run: terraform -chdir=terraform validate

      - name: CI completed
        run: echo "CI job completed successfully."



